<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Strike - Select Game</title>

    <link rel="stylesheet" href="shared/css/shared.css">
    <link rel="stylesheet" href="css/hub.css">
</head>

<body>

    <button id="backBtn" class="corner-btn-left">
        <img src="assets/images/back.png" alt="Back">
    </button>

    <main class="game-shell">

        <section class="game-stage">
            <div class="hub-container">

                <div class="game-card" data-game="./catch-the-eggs/index.html">
                    <img src="catch-the-eggs.png" alt="Catch the Eggs" loading="eager">
                </div>

                <div class="game-card" data-game="./flappy-bird/index.html">
                    <img src="flappy-bird.png" alt="Flappy Bird" loading="eager">
                </div>

            </div>

        </section>

        <aside class="camera-panel">
            <p class="camera-label">Your Camera</p>
            <canvas id="webcamCanvas" width="640" height="480"></canvas>
            <video id="webcamVideo" autoplay playsinline muted></video>
        </aside>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script type="module" src="js/hub.js"></script>
</body>

</html>
